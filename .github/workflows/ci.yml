name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type Check
        run: npx tsc --noEmit

      - name: Biome Lint
        run: npm run lint:biome

      - name: Knip
        run: npm run lint:knip

      - name: API Docs Check
        run: npm run docs:api:check

      - name: Run Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Size Limit
        run: npm run size

      - name: Pack Dry Run
        run: npm run pack:dry-run

      - name: Production Dependency Audit
        run: npm audit --omit=dev
